<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear graph</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1117;
    --panel: #171a23;
    --card: #1c202b;
    --cluster-bg: rgba(255, 255, 255, 0.025);
    --cluster-bg-soft: rgba(255, 255, 255, 0.014);
    --line: #2a2f3d;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --todo: #8b93a7;
    --started: #f2b23e;
    --done: #3fb97a;
    --ready: #4c9dff;
    --blocked: #e8833a;
    --overdue: #ff6b6b;
    --edge: #4e566e;
    --edge-met: #2f5c47;
    --select: #9d8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f5f8;
      --panel: #ffffff;
      --card: #ffffff;
      --cluster-bg: rgba(27, 30, 39, 0.025);
      --cluster-bg-soft: rgba(27, 30, 39, 0.015);
      --line: #d9dce5;
      --text: #1b1e27;
      --muted: #687086;
      --todo: #8088a0;
      --started: #c98a0c;
      --done: #1f9d5f;
      --ready: #1f6fe0;
      --blocked: #cf6a1c;
      --overdue: #d93838;
      --edge: #9da4b8;
      --edge-met: #9fd0b7;
      --select: #6c55f0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  button, select { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1[hidden], header select[hidden] { display: none; }
  header select {
    padding: 5px 10px; max-width: 380px; min-width: 0; font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
  }
  header select:hover, header select:focus-visible { border-color: var(--muted); outline: none; }
  #sync { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #sync.failing { color: var(--overdue); white-space: normal; }
  header button {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); white-space: nowrap;
  }
  header button:hover { border-color: var(--muted); }
  header button:disabled { opacity: .5; cursor: default; }

  /* Compact single-row scrollable milestone filter strip */
  #summary {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px;
    padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  #summary:empty { display: none; }
  .ms-pill {
    position: relative; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font-size: 12px; color: var(--text); overflow: hidden;
  }
  .ms-pill:hover { border-color: var(--muted); }
  .ms-pill.active {
    border-color: var(--select);
    background: color-mix(in srgb, var(--select) 16%, var(--card));
  }
  .ms-pill .cnt { color: var(--muted); font-size: 11px; }
  .ms-pill .date { color: var(--muted); font-size: 11px; }
  .ms-pill .date.overdue { color: var(--overdue); font-weight: 600; }
  .ms-pill .prog {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px; display: flex; background: transparent;
  }
  .ms-pill .prog .done { background: var(--done); }
  .ms-pill .prog .started { background: var(--started); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* Compact notes & toolbar row */
  #notes {
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    padding: 6px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px;
    background: var(--bg);
  }
  #notes:empty { display: none; }
  .tool-btn, .tool-select {
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    color: var(--text); font-size: 12px;
  }
  .tool-btn:hover, .tool-select:hover { border-color: var(--muted); }
  .tool-btn.active { border-color: var(--ready); color: var(--ready); background: color-mix(in srgb, var(--ready) 12%, var(--card)); }
  .tool-group { display: inline-flex; align-items: center; gap: 5px; }
  .tool-group .label { font-size: 11px; color: var(--muted); }
  .warning { color: var(--blocked); }
  /* Sideways-scrolling strips fade at whichever edge still has more to show. */
  .fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  .fade-l { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px); mask-image: linear-gradient(to right, transparent, #000 36px); }
  .fade-l.fade-r {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent);
    mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent);
  }

  /* Ready-to-start popover */
  .ready-wrap { position: relative; }
  #ready-pop {
    position: fixed; left: 12px; top: 120px; z-index: 40;
    width: 360px; max-width: calc(100vw - 24px); max-height: 340px; overflow: auto; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  #ready-pop[hidden] { display: none; }
  .ready-row {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    padding: 6px 8px; border: none; border-radius: 5px; background: none; color: var(--text); font-size: 12px;
  }
  .ready-row:hover { background: var(--card); }
  .ready-row .id { color: var(--ready); font-size: 11px; white-space: nowrap; }
  .ready-row .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Status legend & collapse switches */
  .legend {
    margin-left: auto; display: flex; gap: 6px; align-items: center;
    overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch;
  }
  .toggle {
    padding: 2px 9px; border: 1px solid var(--line); border-radius: 10px; background: none;
    color: var(--text); font-size: 12px; white-space: nowrap; flex: none;
  }
  .toggle:hover { border-color: var(--muted); }
  .toggle::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px;
    background: var(--swatch);
  }
  .toggle.off { border-style: dashed; color: var(--muted); }
  .toggle.off::before { width: 8px; height: 8px; border-radius: 50%; vertical-align: 0; }

  #body { flex: 1; display: flex; min-height: 0; position: relative; }
  /* The stage is a window onto the sheet (#canvas), which app.js moves and scales. */
  #stage {
    flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none;
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1.5px);
  }
  /* Every finger gesture on the graph is the page's own pan and zoom, never the browser's page zoom. */
  #stage, #stage * { touch-action: none; }
  #stage.dragging, #stage.dragging .card, #stage.dragging .pin { cursor: grabbing; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #canvas.gliding { transition: transform .25s ease; }

  #zones { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #edges { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #cards { position: absolute; inset: 0; z-index: 3; }

  .zone {
    position: absolute; border: 1px solid var(--line); border-radius: 12px;
    background: var(--cluster-bg);
  }
  .zone.dashed { border-style: dashed; background: var(--cluster-bg-soft); }
  .zone-title {
    position: absolute; left: 14px; top: 10px; display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .zone-title .sub { font-weight: 400; opacity: .75; }
  .section-heading {
    position: absolute; display: flex; align-items: baseline; gap: 10px; white-space: nowrap;
    font-size: 12.5px; font-weight: 700; color: var(--text); letter-spacing: .03em; text-transform: uppercase;
  }
  .section-heading .sub {
    font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px;
  }

  .controls {
    position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 10;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: default;
  }
  .controls button { width: 34px; height: 32px; border: none; background: none; font-size: 16px; line-height: 1; }
  .controls button + button { border-top: 1px solid var(--line); }
  .controls button:hover { background: var(--card); }
  #zoom-fit { font-size: 11px; }

  #minimap {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 10;
    cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  #map-nodes rect { fill: var(--todo); }
  #map-nodes rect.started { fill: var(--started); }
  #map-nodes rect.done { fill: var(--done); }
  #map-nodes rect.ready { fill: var(--ready); }
  #map-nodes rect.blocked { fill: var(--blocked); }
  #map-nodes rect.selected { stroke: var(--select); stroke-width: 24; }
  #map-view {
    fill: color-mix(in srgb, var(--select) 12%, transparent);
    stroke: var(--select); stroke-width: 2; vector-effect: non-scaling-stroke;
  }

  .edge { color: var(--edge); }
  .edge.met { color: var(--edge-met); }
  .edge.cyclic { color: var(--overdue); }
  .edge.lit { color: var(--select); }
  .edge .line { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .edge .head { fill: currentColor; }
  .edge.cyclic .line { stroke-dasharray: 5 4; }
  .edge.via .line { stroke-dasharray: 2 5; }
  .edge.lit .line { stroke-width: 2.5; }
  #edges.focused .edge:not(.lit) { opacity: .16; }

  .card {
    position: absolute; display: flex; flex-direction: column; gap: 3px;
    padding: 8px 10px 8px 12px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--todo); border-radius: 8px;
  }
  .card:hover { border-color: var(--muted); border-left-color: var(--accent, var(--todo)); }
  .card.started { --accent: var(--started); border-left-color: var(--started); }
  .card.done { --accent: var(--done); border-left-color: var(--done); }
  .card.ready { --accent: var(--ready); border-left-color: var(--ready); }
  .card.blocked { --accent: var(--blocked); border-left-color: var(--blocked); }
  .card.done .title { color: var(--muted); text-decoration: line-through; }
  .card.selected { outline: 2px solid var(--select); outline-offset: 1px; }
  .card.dimmed, .pin.dimmed { opacity: .22; }
  #cards.focused .card:not(.lit), #cards.focused .pin:not(.lit) { opacity: .24; }

  /* The dot a collapsed status folds into. The number is how many issues it stands for. */
  .pin {
    position: absolute; display: flex; align-items: center; justify-content: center; padding: 0;
    border: 2px solid var(--bg); border-radius: 50%; background: var(--todo);
    color: #0f1117; font-size: 12px; font-weight: 700; line-height: 1;
  }
  .pin.ready { background: var(--ready); }
  .pin.started { background: var(--started); }
  .pin.blocked { background: var(--blocked); }
  .pin.done { background: var(--done); }
  .pin:hover { filter: brightness(1.15); }
  .pin.selected { outline: 2px solid var(--select); outline-offset: 2px; }

  .card .top, .card .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .id { color: var(--muted); font-size: 11px; }
  .card .state { font-size: 11px; color: var(--accent, var(--muted)); white-space: nowrap; }
  .card .title {
    flex: 1; font-weight: 500; line-height: 1.3; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card .bottom { font-size: 11px; color: var(--muted); }
  .card .who { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .due { white-space: nowrap; }
  .overdue { color: var(--overdue); font-weight: 600; }

  #detail {
    width: 340px; flex: none; overflow: auto; padding: 16px 18px;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  #detail[hidden] { display: none; }
  #detail .close { float: right; border: none; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; }
  #detail h2 { margin: 2px 0 10px; font-size: 15px; }
  #detail a { color: var(--ready); text-decoration: none; }
  #detail a:hover { text-decoration: underline; }
  #detail dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; margin: 14px 0; }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; }
  #detail h3 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  #detail .link {
    display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 6px; text-align: left;
    border: none; border-radius: 5px; background: none;
  }
  #detail .link:hover { background: var(--card); }
  #detail .link .id { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #detail .none { color: var(--muted); padding: 0 6px; }
  #detail .folded { margin-top: 8px; color: var(--muted); }
  #detail .action { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  #detail .action:hover { border-color: var(--muted); }

  #message { position: relative; margin: 0; padding: 40px 18px; color: var(--muted); }
  #message[hidden] { display: none; }

  /* Mobile ergonomics */
  @media (max-width: 720px) {
    header { padding: 8px 12px; gap: 8px; }
    header select { flex: 1 1 auto; max-width: none; font-size: 13px; padding: 6px 8px; }
    header button { padding: 6px 10px; min-height: 34px; }
    #summary { padding: 6px 12px; }
    /* One sideways-scrolling toolbar row instead of two wrapped rows, to leave the graph more room. */
    #notes {
      padding: 6px 12px; gap: 6px 8px; flex-wrap: nowrap; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #notes::-webkit-scrollbar, #summary::-webkit-scrollbar { display: none; }
    #notes > * { flex: none; }
    .legend { margin-left: 0; overflow: visible; }
    .warning { white-space: nowrap; }
    .tool-btn, .tool-select { padding: 5px 9px; min-height: 30px; }
    .controls button { width: 40px; height: 38px; font-size: 18px; }
    #zoom-fit { font-size: 12px; }
    #detail {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-height: 58vh; z-index: 30;
      border-left: none; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
      box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.45);
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    }
  }
  /* Phones, and anything too short for the small map to leave the graph room (a phone on its side). */
  @media (max-width: 640px), (max-height: 500px) {
    #minimap { display: none !important; }
  }
  @media (max-width: 640px) {
    #sync { font-size: 11px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Linear graph</h1>
  <select id="project" aria-label="Project" hidden></select>
  <span id="sync"></span>
  <button id="refresh" type="button">Refresh</button>
</header>
<section id="summary"></section>
<section id="notes"></section>
<div id="body">
  <main id="stage">
    <p id="message">Reading the issues…</p>
    <div id="canvas">
      <div id="zones"></div>
      <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="cards"></div>
    </div>
    <div class="controls">
      <button id="zoom-in" type="button" title="Zoom in (+)">+</button>
      <button id="zoom-out" type="button" title="Zoom out (−)">−</button>
      <button id="zoom-fit" type="button" title="Show everything (0)">Fit</button>
      <button id="flow" type="button">↓</button>
    </div>
    <svg id="minimap" xmlns="http://www.w3.org/2000/svg">
      <g id="map-nodes"></g>
      <rect id="map-view"></rect>
    </svg>
  </main>
  <aside id="detail" hidden></aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
